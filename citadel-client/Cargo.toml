[package]
name = "citadel-client"
version = "0.2.0"
edition = "2021"

[dependencies]
guard-net = { path = "../guard-net" }
guard-svc = { path = "../guard-svc" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Console",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
strip = true
panic = "unwind"

[[bin]]
name = "citadel-client"
path = "src/main.rs"

[[bin]]
name = "citadel-recovery"
path = "src/bin/recovery.rs"
