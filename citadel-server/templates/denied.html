<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden — Proctor Authorization Required</title>
  <style>
    :root {
      --bg-base: #070a0f;
      --bg-surface: #0c101a;
      --border-subtle: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .box {
      background: var(--bg-surface);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 36px 32px;
      border-radius: 10px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }
    .badge-error {
      display: inline-block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    h1 { color: #f87171; font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    p { color: var(--text-muted); font-size: 13.5px; line-height: 1.6; margin-bottom: 20px; }
    .token-box {
      background: #06090e;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 12px 14px;
      text-align: left;
      font-family: Consolas, monospace;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .token-box code { color: #38bdf8; }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12.5px;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #3b82f6; }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge-error">403 FORBIDDEN</div>
    <h1>Administrator Authorization Required</h1>
    <p>This administrative management interface is restricted to proctors. Candidate workstations cannot access this resource.</p>
    <div class="token-box">
      Recruiters: Supply your designated <code>?key=...</code> access token:<br>
      <code>/admin?key=citadel-recruiter-key-2026</code>
    </div>
    <a href="/exam" class="btn">Return to Exam Portal</a>
  </div>
</body>
</html>
