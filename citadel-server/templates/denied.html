<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>403 Forbidden — Proctor Authorization Required</title>
  <style>
    :root {
      --bg-base: #0b0a09;
      --bg-surface: #11100f;
      --border-subtle: #242321;
      --text-main: #e6e2dc;
      --text-muted: #a5a39f;
      --font-ui: 'Geist', "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-ui); font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .box {
      background: var(--bg-surface);
      border: 1px solid #a03f40;
      padding: 36px 32px;
      border-radius: 10px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }
    .badge-error {
      display: inline-block;
      background: #290b0b;
      border: 1px solid #a03f40;
      color: #f47a79;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    h1 { color: #f47a79; font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    p { color: var(--text-muted); font-size: 13.5px; line-height: 1.6; margin-bottom: 20px; }
    .token-box {
      background: #070605;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 12px 14px;
      text-align: left;
      font-family: var(--font-mono); font-weight: 300;
      font-size: 12px;
      color: #a5a39f;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .token-box code { color: #a2bad8; }
    .btn {
      display: inline-block;
      background: #48658b;
      color: #f2f0ec;
      text-decoration: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12.5px;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #5f82b0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge-error">403 FORBIDDEN</div>
    <h1>Administrator Authorization Required</h1>
    <p>This administrative management interface is restricted to proctors. Candidate workstations cannot access this resource.</p>
    <div class="token-box">
      Recruiters: Supply your designated <code>?key=...</code> access token:<br>
      <code>/admin?key=citadel-recruiter-key-2026</code>
    </div>
    <a href="/exam" class="btn">Return to Exam Portal</a>
  </div>
</body>
</html>
