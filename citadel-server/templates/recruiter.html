<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CITADEL LMS — Recruiter & Proctor Center</title>
  <style>
    :root {
      --bg-base: #070a0f;
      --bg-surface: #0c101a;
      --bg-surface-elevated: #131b28;
      --border-subtle: #1e293b;
      --border-focus: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-blue: #38bdf8;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --font-mono: Consolas, "JetBrains Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 48px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      background: #2563eb;
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .sync-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--accent-green);
      font-weight: 600;
      background: rgba(52, 211, 153, 0.1);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid rgba(52, 211, 153, 0.25);
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
    }

    .nav-tabs {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 24px;
      display: flex;
      gap: 4px;
      height: 40px;
      flex-shrink: 0;
    }

    .nav-tab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      padding: 0 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .nav-tab:hover { color: #fff; }
    .nav-tab.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
    }

    main {
      padding: 24px;
      flex: 1;
      overflow-y: auto;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 16px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-val {
      font-size: 24px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: #fff;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 10px 12px;
      background: var(--bg-surface-elevated);
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-subtle);
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-main);
    }

    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-active { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .status-flagged { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    .status-logged-out { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2); }
    .status-disqualified { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }

    .btn-sm {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-sm:hover { background: #1e293b; }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.35);
      color: #f87171;
    }
    .btn-danger:hover {
      background: #ef4444;
      color: #fff;
    }

    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }
    .btn-primary:hover { background: #3b82f6; }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      <span class="brand-logo">CITADEL</span>
      <span>Recruiter Console</span>
    </div>
    <div class="header-actions">
      <div class="sync-indicator">
        <div class="sync-dot"></div>
        <span>Live Heartbeat</span>
      </div>
      <a href="/exam" class="btn-sm">Open Candidate Portal</a>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchNav('candidates')">Candidate Monitoring</button>
    <button class="nav-tab" onclick="switchNav('questions')">Problem Bank</button>
  </div>

  <main>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Candidates</div>
        <div class="stat-val" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Now</div>
        <div class="stat-val" id="stat-active" style="color: #34d399;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Flagged</div>
        <div class="stat-val" id="stat-flagged" style="color: #fbbf24;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Logged Out</div>
        <div class="stat-val" id="stat-logged-out" style="color: #94a3b8;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Disqualified</div>
        <div class="stat-val" id="stat-disqualified" style="color: #f87171;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Submissions</div>
        <div class="stat-val" id="stat-subs">0</div>
      </div>
    </div>

    <!-- VIEW: CANDIDATES -->
    <div id="view-candidates" class="card">
      <div class="card-head">
        <div class="card-title">Live Candidate Fleet</div>
        <button class="btn-sm" onclick="fetchMetrics()">Refresh</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Candidate ID</th>
            <th>Status</th>
            <th>Active Problem</th>
            <th>Score</th>
            <th>Last Seen</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="candidate-table-body">
          <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading candidates...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- VIEW: QUESTIONS -->
    <div id="view-questions" class="card" style="display: none;">
      <div class="card-head">
        <div class="card-title">Assessment Problem Bank</div>
        <button class="btn-sm btn-primary">+ Add Problem</button>
      </div>
      <div id="questions-list"></div>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const AUTH_KEY = urlParams.get('key') || 'citadel-recruiter-key-2026';

    function switchNav(view) {
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      if (view === 'candidates') {
        document.querySelectorAll('.nav-tab')[0].classList.add('active');
        document.getElementById('view-candidates').style.display = 'block';
        document.getElementById('view-questions').style.display = 'none';
      } else {
        document.querySelectorAll('.nav-tab')[1].classList.add('active');
        document.getElementById('view-candidates').style.display = 'none';
        document.getElementById('view-questions').style.display = 'block';
        loadQuestions();
      }
    }

    async function fetchMetrics() {
      try {
        const res = await fetch(`/api/v1/admin/metrics?key=${AUTH_KEY}`);
        if (!res.ok) return;
        const data = await res.json();

        document.getElementById('stat-total').innerText = data.total_candidates;
        document.getElementById('stat-active').innerText = data.active_candidates;
        document.getElementById('stat-flagged').innerText = data.flagged_candidates;
        document.getElementById('stat-logged-out').innerText = data.logged_out_candidates;
        document.getElementById('stat-disqualified').innerText = data.disqualified_candidates;
        document.getElementById('stat-subs').innerText = data.submissions.length;

        renderCandidateTable(data.candidates);
      } catch (e) {}
    }

    function renderCandidateTable(candidates) {
      const tbody = document.getElementById('candidate-table-body');
      if (!candidates || candidates.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding: 24px;">No candidates connected</td></tr>';
        return;
      }

      tbody.innerHTML = candidates.map(c => {
        let statusClass = 'status-active';
        if (c.status === 'Flagged') statusClass = 'status-flagged';
        else if (c.status === 'Logged Out') statusClass = 'status-logged-out';
        else if (c.status === 'Disqualified') statusClass = 'status-disqualified';

        const lastSeen = c.last_seen ? new Date(c.last_seen).toLocaleTimeString() : 'N/A';

        return `
          <tr>
            <td style="font-weight: 700; color: #fff;">${c.id}</td>
            <td><span class="status-badge ${statusClass}">${c.status}</span></td>
            <td>${c.active_question}</td>
            <td>${c.score} pts</td>
            <td>${lastSeen}</td>
            <td>
              ${c.status !== 'Disqualified' ? `
                <button class="btn-sm btn-danger" onclick="disqualifyCandidate('${c.id}')">Disqualify</button>
              ` : '<span style="color: var(--text-dim); font-size: 11px;">Disqualified</span>'}
            </td>
          </tr>
        `;
      }).join('');
    }

    async function disqualifyCandidate(id) {
      if (!confirm(`Disqualify candidate ${id}?`)) return;
      await fetch(`/api/v1/admin/candidates/${id}/disqualify?key=${AUTH_KEY}`, { method: 'POST' });
      fetchMetrics();
    }

    async function loadQuestions() {
      const res = await fetch('/api/v1/questions');
      const qList = await res.json();
      const container = document.getElementById('questions-list');
      container.innerHTML = qList.map(q => `
        <div style="background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 16px; margin-bottom: 12px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div style="font-weight: 700; color: #fff;">${q.title} (${q.difficulty})</div>
            <div style="color: var(--text-muted); font-size: 12px;">${q.sample_cases.length} Sample Cases</div>
          </div>
          <p style="color: var(--text-muted); font-size: 13px; line-height: 1.5;">${q.description.substring(0, 150)}...</p>
        </div>
      `).join('');
    }

    fetchMetrics();
    setInterval(fetchMetrics, 3000);
  </script>
</body>
</html>
